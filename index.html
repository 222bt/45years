<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="0세부터 45세까지, 선택이 쌓여 한 사람의 인생이 됩니다. 34가지 엔딩의 인생 성장 시뮬레이션.">
<title>45년</title>
<link rel="preload" href="fonts/NeoDunggeunmo.woff" as="font" type="font/woff" crossorigin>
<style>
/* 기본 리셋 */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
@font-face{font-family:"NeoDunggeunmo";src:url("fonts/NeoDunggeunmo.woff") format("woff");font-display:block}
/* Layout: 문틀에 연필로 키를 재던 자국 — 상단 '키재기 자'가 나이를 따라 자라고, 그 아래 종이 한 장에 이야기가 놓인다 */
:root{
  --wall:#e6ebe3; --paper:#fbfcf8; --ink:#22282a; --muted:#646e68; --line:#cdd5ca;
  --pencil:#4a5055; --mark:#f1c84b; --accent:#2c55c4; --accent-ink:#ffffff;
  --st-i:#2f62cf; --st-p:#d24f33; --st-d:#8b7419; --st-a:#8a46c2; --st-c:#cc3f78; --st-w:#17806f;
  --good:#1f7a4d; --bad:#b4442f;
  --f-hand:"NeoDunggeunmo","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --f-story:"NeoDunggeunmo","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --f-ui:"NeoDunggeunmo","Apple SD Gothic Neo","Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#151a19; --paper:#1f2524; --ink:#e7ece5; --muted:#9aa49d; --line:#344039;
  --pencil:#b9c0bb; --mark:#e0b53b; --accent:#7c9cf5; --accent-ink:#0f1420;
  --st-i:#7ea2f2; --st-p:#f08467; --st-d:#d0b55a; --st-a:#bd8ae8; --st-c:#ef7ba7; --st-w:#4fc3ad;
  --good:#5cc78f; --bad:#f08467; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#151a19; --paper:#1f2524; --ink:#e7ece5; --muted:#9aa49d; --line:#344039;
  --pencil:#b9c0bb; --mark:#e0b53b; --accent:#7c9cf5; --accent-ink:#0f1420;
  --st-i:#7ea2f2; --st-p:#f08467; --st-d:#d0b55a; --st-a:#bd8ae8; --st-c:#ef7ba7; --st-w:#4fc3ad;
  --good:#5cc78f; --bad:#f08467; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;line-break:strict;-webkit-font-smoothing:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;word-break:keep-all}
p,.ct,.td,.howto div,.story{text-wrap:pretty}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-hand);font-size:28px;font-weight:400;line-height:1.1}
.brand small{font-size:13px;color:var(--muted);margin-left:8px;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* 키재기 자 */
.ruler{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px 4px;overflow:hidden}
.ruler svg{display:block;width:100%;height:auto}
.ruler text{font-family:var(--f-hand)}

.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px clamp(18px,5vw,40px);display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .age{font-size:22px;letter-spacing:0;color:var(--ink);font-weight:400}
h1,h2{font-family:var(--f-story);font-weight:400;text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:clamp(28px,7.5vw,40px)}
h2{font-size:clamp(22px,5.6vw,28px)}
.story{font-size:17px;line-height:1.9;margin:0;max-width:40em}
.story + .story{margin-top:-6px}
.hand{font-size:19px;line-height:1.5}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s,transform .15s}
.choice:hover{border-color:var(--ink);transform:translateX(3px)}
.choice .ct{font-size:16px;line-height:1.5}
.choice .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.tag.i{color:var(--st-i)}.tag.p{color:var(--st-p)}.tag.d{color:var(--st-d)}.tag.a{color:var(--st-a)}.tag.c{color:var(--st-c)}.tag.w{color:var(--st-w)}
.tag.j{color:var(--muted)}
.tag.check{color:var(--ink);border-style:dashed}

.btn{background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:12px 22px;font-size:16px;align-self:flex-start;max-width:100%;text-align:center}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 능력치 */
.stats{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .top{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:14px;white-space:nowrap}
.stat .v{font-variant-numeric:tabular-nums;font-size:18px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.joy{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap;padding-top:6px;border-top:1px dashed var(--line)}
.joy .bar{flex:1}
.joy .face{font-size:15px;color:var(--muted);text-align:right}
.traits{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.trait-chip.fam{background:transparent;border:1px solid var(--mark);color:var(--ink)}
.trait-chip{font-size:13px;padding:2px 9px;border-radius:4px;background:var(--wall);color:var(--muted);font-weight:500}

/* 결과 */
.outcome{border-left:3px solid var(--mark);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:10px}
.verdict{font-size:24px;line-height:1.3;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.verdict.ok{color:var(--good)}.verdict.ng{color:var(--bad)}
.deltas{display:flex;gap:6px;flex-wrap:wrap}

/* 시작 화면 */
.field{display:flex;flex-direction:column;gap:6px;max-width:320px}
.field label{font-size:14px;color:var(--muted)}
.field .lbl{font-size:14px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-btn{background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;font-size:17px}
.seg-btn[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.field input{font:inherit;font-size:24px;width:100%;box-sizing:border-box;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;font-size:14px;line-height:1.7;color:var(--muted)}
@media (max-width:560px){.howto{grid-template-columns:1fr}}
.howto b{display:block;color:var(--ink);font-size:16px;font-weight:400;margin-bottom:4px}

/* 특성 */
.trait-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.trait-pick{grid-template-columns:1fr}}
.trait{text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px}
.trait:hover{border-color:var(--ink)}
.trait .tn{font-size:20px;line-height:1.3}
.trait .td{font-size:14px;color:var(--muted)}
.recap{display:flex;gap:6px;flex-wrap:wrap}

/* 엔딩 */
.ending-head{display:flex;flex-direction:column;gap:6px}
.ending-no{font-size:16px;color:var(--muted)}
.badmark{color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:0 6px;margin-right:4px}
.ending-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:start}
@media (max-width:600px){.ending-grid{grid-template-columns:1fr}}
.radar text{font-family:var(--f-ui);font-size:11px}
.log{max-height:320px;overflow:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6}
.log div{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px}
.log b{font-weight:400;color:var(--ink)}
.log .a{color:var(--muted)}
details summary{cursor:pointer;font-size:15px}

.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
@media (max-width:480px){.coll{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:10px}}
.card{border:1.5px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.card.got{border-color:var(--ink)}
.card .cn{font-size:16px;line-height:1.4}
.portrait{align-self:flex-start;padding:8px;background:var(--wall);border:1px solid var(--line);border-radius:6px;line-height:0}
.sprite,.thumb{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.sprite{width:192px;height:192px;max-width:100%}
.thumb{width:100%;height:auto;aspect-ratio:1;max-width:100%;border-radius:4px}
.locked-thumb{display:grid;place-items:center;background:var(--wall);color:var(--muted);font-size:32px;line-height:1}
.card .hint{font-size:13px;line-height:1.55;color:var(--ink);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.card .ch{font-size:13px;color:var(--muted);line-height:1.5}
.card.locked .cn{color:var(--muted)}
.counter{font-size:18px}

.settings{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.set-head{display:flex;justify-content:space-between;align-items:center}
.set-head h3{margin:0;font-size:18px;font-weight:400}
.set-row{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3.2em auto;gap:10px;align-items:center;font-size:15px}
.set-row input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.set-row output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.mini{background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px}
.set-note{margin:0;font-size:13px;color:var(--muted)}
.save-note{margin:0;font-size:14px;color:var(--muted)}
.undo-btn{position:absolute;top:12px;right:12px;width:40px;height:40px;display:grid;place-items:center;background:transparent;border:1.5px solid var(--line);border-radius:6px;color:var(--muted);padding:0}
.undo-btn:hover{color:var(--ink);border-color:var(--ink)}
.sheet:has(.undo-btn) .eyebrow{padding-right:44px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:480px){
  body{font-size:15px}
  .sheet{padding:22px 16px;gap:18px}
  .story{font-size:16px;line-height:1.85}
  .choice{padding:13px 14px}
  .choice .ct{font-size:15.5px}
  .btn{align-self:stretch}
  .row>.btn{flex:1 1 100%}
  .row .counter{width:100%}
  .stats{padding:12px;gap:10px 14px}
  .joy .face{font-size:14px}
  .brand{font-size:24px}
  .brand small{display:block;margin:4px 0 0}
  .ruler{padding:8px 8px 2px}
}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.choice,.bar>i{transition:none}}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ───────── 기본 데이터 ───────── */
const STATS=[
  {k:'i',n:'지능'},{k:'p',n:'운동'},{k:'d',n:'손재주'},
  {k:'a',n:'감성'},{k:'c',n:'매력'},{k:'w',n:'의지'}];
const SN=Object.fromEntries(STATS.map(s=>[s.k,s.n]));
const STAGES=[
  {name:'아기 시절',from:0,to:6,n:7},
  {name:'초등학생',from:7,to:12,n:10},
  {name:'청소년기',from:13,to:19,n:10},
  {name:'청년기',from:20,to:29,n:9},
  {name:'어른의 시간',from:30,to:45,n:9}];
const TEMPERS=[
  {k:'i',n:'눈이 반짝이는 아기',d:'무엇이든 오래 들여다본다.'},
  {k:'p',n:'발길질이 힘찬 아기',d:'잠시도 가만히 있지 않는다.'},
  {k:'d',n:'손이 야무진 아기',d:'작은 것도 꼭 쥐고 놓지 않는다.'},
  {k:'a',n:'노래에 반응하는 아기',d:'음악이 나오면 울음을 그친다.'},
  {k:'c',n:'방긋 웃는 아기',d:'처음 보는 사람에게도 웃어 준다.'},
  {k:'w',n:'잘 울지 않는 아기',d:'넘어져도 금방 다시 일어난다.'}];
const TRAITS=[
  {id:'bw',n:'책벌레',d:'지능이 오를 때마다 +1',s:'i'},
  {id:'rn',n:'새벽 달리기',d:'운동이 오를 때마다 +1',s:'p'},
  {id:'mk',n:'만들기 상자',d:'손재주가 오를 때마다 +1',s:'d'},
  {id:'dy',n:'일기 쓰기',d:'감성이 오를 때마다 +1',s:'a'},
  {id:'sc',n:'사람 좋아',d:'매력이 오를 때마다 +1',s:'c'},
  {id:'gr',n:'끈기',d:'의지가 오를 때마다 +1',s:'w'},
  {id:'op',n:'낙천가',d:'행복이 오르면 +2, 떨어질 땐 절반만'},
  {id:'lk',n:'행운아',d:'모든 판정 성공 확률 +15%'},
  {id:'vs',n:'호기심 대장',d:'선택할 때마다 무작위 능력치 +1'},
  {id:'fc',n:'몰입',d:'한 번에 가장 크게 오른 능력치 +2'}];

/* 습관 이름은 얻는 나이에 맞게 바뀐다: [6세, 12세, 19세, 29세] */
const TRAIT_NAMES={
  bw:['그림책 사랑','책벌레','책벌레','퇴근 후 독서'],
  rn:['뛰어놀기 대장','줄넘기 연습','새벽 달리기','새벽 달리기'],
  mk:['블록 쌓기','만들기 상자','공구함','주말 공방'],
  dy:['그림일기','일기 쓰기','일기 쓰기','기록하는 습관'],
  sc:['인사 잘하는 아이','친구 많은 아이','사람 좋아','사람 좋아'],
  gr:['끝까지 해 보기','끈기','끈기','끈기'],
  op:['잘 웃는 아이','낙천가','낙천가','낙천가'],
  lk:['네잎클로버','행운아','행운아','행운아'],
  vs:['"왜요?" 대장','호기심 대장','호기심 대장','호기심 대장'],
  fc:['한 가지에 푹 빠지기','몰입','몰입','몰입']};
function tn(id,stage){
  if(stage==null)stage=S&&S.traitAt&&S.traitAt[id]!=null?S.traitAt[id]:2;
  return (TRAIT_NAMES[id]||[])[Math.min(3,stage)]||TRAITS.find(t=>t.id===id).n}
/* 이벤트: c(선택지) = {t, fx, r} 또는 {t, chk, dc, ok:{fx,r}, ng:{fx,r}} */
const EV=[
/* ── 0 아기 시절 ── */
{s:0,t:'첫 장난감',x:'백일 선물로 받은 상자에서 딸랑이, 나무 블록, 헝겊 그림책이 나왔다. {N}의 작은 손이 하나를 향해 뻗는다.',c:[
 {t:'딸랑이를 흔든다',fx:{a:2,j:3},r:'딸랑딸랑. 소리에 맞춰 두 발을 구르며 까르르 웃는다.'},
 {t:'나무 블록을 만지작거린다',fx:{d:2,i:1},r:'블록을 이리저리 돌려 보다가 하나 위에 하나를 올리는 법을 깨친다.'},
 {t:'헝겊 그림책을 붙잡는다',fx:{i:2,a:1},r:'알록달록한 그림을 한참 들여다본다. 책장 넘기는 소리가 좋다.'}]},
{s:0,t:'첫 걸음',x:'돌잔치를 일주일 앞둔 저녁, {N}이(가) 소파 모서리를 붙잡고 몸을 일으킨다. 거실의 모든 눈이 쏠렸다.',c:[
 {t:'손을 놓고 앞으로 걸어 본다',chk:'p',dc:6,ok:{fx:{p:3,j:3},r:'한 걸음, 두 걸음, 세 걸음! 거실에 박수가 터진다.'},ng:{fx:{p:1,w:2},r:'엉덩방아. 잠깐 울먹이다가 다시 소파를 붙잡는다.'}},
 {t:'엄마 아빠 품으로 기어간다',fx:{c:2,j:2},r:'걷기는 다음으로 미루고 가장 따뜻한 곳으로 직행했다.'},
 {t:'앉아서 사람들을 구경한다',fx:{i:1,a:1},r:'모두가 왜 손뼉을 치는지 궁금한 얼굴로 바라본다.'}]},
{s:0,t:'첫 단어',x:'옹알이가 점점 말이 되어 간다. 오늘 아침, {N}의 입에서 처음으로 또렷한 소리가 나왔다.',c:[
 {t:'"엄마!"',fx:{c:2,j:2},r:'가족 단톡방이 하루 종일 시끄러웠다.'},
 {t:'"이거 뭐야?"',fx:{i:3},r:'그날부터 집 안의 모든 물건에 이름을 물어보기 시작했다.'},

{s:0,t:'모래 놀이터',x:'아파트 놀이터 모래밭. 플라스틱 삽과 양동이를 든 아이들이 모여 있다.',c:[

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function josa(name,a,b){const c=name.charCodeAt(name.length-1);if(c<0xAC00||c>0xD7A3)return a+'('+b+')';return ((c-0xAC00)%28)?a:b}
function nameOf(k){
  if(k==='N')return S?S.name:'아이';
  if(k==='P')return S&&S.pet?S.pet.name:'반려동물';
  if(k==='FP')return S&&S.firstPet?S.firstPet:'첫 반려동물';
  if(k==='L')return S&&S.partner?S.partner.name:'그 사람';
  if(k==='GR'){const sc=S.stats.i+S.stats.w*.4+(S.gr||0)*1.5;const pct=Math.max(1,Math.min(96,Math.round(96-(sc-12)*2)));

}
function fill(t){return String(t).replace(/\{(N|P|FP|L|GR)\}(이\(가\)|은\(는\)|을\(를\)|과\(와\)|와)?/g,(m,k,j)=>{const n=nameOf(k);
  if(!j)return n; if(j==='와')return n+josa(n,'과','와'); const [a,b]=j.slice(0,-1).split('(');return n+josa(n,a,b)})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function newGame(name,gender){
  const t=TEMPERS[Math.floor(Math.random()*6)];
  const st={};STATS.forEach(s=>st[s.k]=3);st[t.k]+=4;
  S={name,gender,temper:t.k,stats:st,joy:50,stage:0,queue:[],qi:0,traits:[],log:[],last:null,phase:'intro',stageStart:{...st},offer:null,pet:null,firstPet:null,partner:null,kids:0,bond:0,solo:false,cohouse:false,iso:0,debt:0,idle:0,bigFail:0};
  buildQueue();save();
}
function buildQueue(){
  const st=STAGES[S.stage];
  const all=EV.map((e,i)=>i).filter(i=>EV[i].s===S.stage);
  const ok=i=>!EV[i].need||EV[i].need(S);
  const fixed=all.filter(i=>EV[i].fix&&(EV[i].lazy||ok(i)));
  const solid=fixed.filter(i=>!EV[i].lazy).length;
  const rand=shuffle(all.filter(i=>!EV[i].fix&&ok(i))).slice(0,Math.max(0,st.n-solid-(S.stage===4?1:0)));
  // 원래 순서(대략적인 나이 흐름)를 유지
  const pool=[...fixed,...rand].sort((a,b)=>a-b);
  if(S.stage===4)pool.push('CHAL');
  S.queue=pool;S.qi=0;S.done=0;S.stageStart={...S.stats};skipInvalid();
}
function skipInvalid(){while(S.qi<S.queue.length&&S.queue[S.qi]!=='CHAL'&&EV[S.queue[S.qi]].need&&!EV[S.queue[S.qi]].need(S))S.qi++}
function choicesOf(ev){return ev.c.filter(c=>!c.need||c.need(S))}
function dcOf(c){return typeof c.dc==='function'?c.dc(S):c.dc}
/* 진행도: 지금 조건으로 앞으로 나올 사건만 센다 (조건이 안 맞아 건너뛸 사건은 빼고) */
function stageTotal(){let n=S.done||0;for(let k=S.qi;k<S.queue.length;k++){const id=S.queue[k];if(id==='CHAL'||!EV[id].need||EV[id].need(S))n++}return Math.max(n,(S.done||0)+1)}
function ageNow(){const st=STAGES[S.stage];const span=st.to-st.from+1;return Math.min(st.to,st.from+Math.floor((S.done||0)*span/stageTotal()))}
function currentEvent(){
  const id=S.queue[S.qi];
  if(id!=='CHAL')return EV[id];
  const top=STATS.map(s=>s.k).sort((a,b)=>S.stats[b]-S.stats[a]).slice(0,2);
  return {t:'인생 최대의 도전',x:'마흔다섯. 지금까지 쌓아 온 모든 것을 걸어 볼 기회가 왔다. 성공하면 이름이 남고, 실패해도 무언가는 남을 것이다.',c:[
    ...top.map(k=>({t:CHAL[k].t,chk:k,dc:38,ok:{fx:{[k]:8,j:6},r:CHAL[k].ok},ng:{fx:{[k]:3,w:3},r:CHAL[k].ng}})),
    {t:'도전 대신 지금의 삶을 지킨다',fx:{j:6,w:1},r:'모두가 아쉬워했지만, 그날 저녁 식탁은 따뜻했다.'}]};
}
function chance(k,dc){let c=50+(S.stats[k]-dc)*4;c=Math.max(8,Math.min(92,c));if(S.traits.includes('lk'))c=Math.min(97,c+15);return Math.round(c)}
function applyFx(fx){
  const d={};
  for(const k in fx){
    let v=fx[k];
    if(k==='b'){S.bond=(S.bond||0)+v;d.b=v;continue}
    if(k==='gr'){S.gr=(S.gr||0)+v;d.gr=v;continue}
    if(k==='iso'||k==='debt'||k==='idle'){S[k]=Math.max(0,(S[k]||0)+v);d[k]=v;continue}
    if(k==='l'){if(S.partner)S.partner.love+=v;d.l=v;continue}
    if(k==='j'){
      if(S.traits.includes('op'))v=v>0?v+2:Math.ceil(v/2);
      S.joy=Math.max(0,Math.min(100,S.joy+v));d.j=(d.j||0)+v;continue}
    if(v>0){const t=TRAITS.find(t=>t.s===k&&S.traits.includes(t.id));if(t)v+=1}
    S.stats[k]=Math.max(0,S.stats[k]+v);d[k]=(d[k]||0)+v;
  }
  if(S.traits.includes('fc')){
    const ks=Object.keys(d).filter(k=>ORDER.includes(k)&&d[k]>0).sort((a,b)=>d[b]-d[a]);
    if(ks.length){S.stats[ks[0]]+=2;d[ks[0]]+=2}}
  if(S.traits.includes('vs')){const k=ORDER[Math.floor(Math.random()*6)];S.stats[k]+=1;d[k]=(d[k]||0)+1}
  return d;
}
function choose(ci){
  const ev=currentEvent(), c=choicesOf(ev)[ci], age=ageNow();
  const snap=JSON.stringify({...S,undo:null});
  let res,verdict=null;
  S.rolls=S.rolls||{};const rk=S.stage+'-'+S.qi;
  if(c.chk){const p=chance(c.chk,dcOf(c));if(S.rolls[rk]==null)S.rolls[rk]=Math.random()*100;const ok=S.rolls[rk]<p;res=ok?c.ok:c.ng;verdict={ok,p,k:c.chk};if(!ok&&dcOf(c)>=18)S.bigFail=(S.bigFail||0)+1}
  else res=c;
  const d=applyFx(res.fx);
  S.undo=snap;S.done=(S.done||0)+1;
  if(res.on)res.on(S);
  if(S.pet&&S.pet.alive&&!S.pet.name){
    S.pending={title:fill(ev.t),choice:fill(c.t),r:res.r,d,verdict,age};S.phase='petname';save();render();
    document.getElementById('pn')?.focus();return}
  S.last={title:fill(ev.t),choice:fill(c.t),r:fill(res.r),d,verdict,age};
  S.log.push({age,t:fill(ev.t),c:fill(c.t),v:verdict?verdict.ok:null});
  S.phase='result';save();render();
}
let PETERR=false;
function namePet(){
  const v=(document.getElementById('pn')?.value||'').trim();
  if(!v){PETERR=true;render();document.getElementById('pn')?.focus();return}
  PETERR=false;S.pet.name=v;if(!S.firstPet)S.firstPet=v;
  const P=S.pending;S.pending=null;
  S.last={...P,r:fill(P.r)};
  S.log.push({age:P.age,t:P.title,c:P.choice+` (이름: ${v})`,v:P.verdict?P.verdict.ok:null});
  S.phase='result';save();render();
}
/* 마지막 선택 되돌리기: 판정 주사위는 그대로 남겨 같은 결과가 나오게 한다 */
function undo(){
  if(!S||!S.undo)return;
  const rolls=S.rolls||{};
  S=JSON.parse(S.undo);S.rolls=rolls;S.undo=null;S.phase='event';
  PETERR=false;save();render();
}
function undoBtn(){return S&&S.undo?`<button class="undo-btn" data-a="undo" aria-label="이전 선택으로 되돌리기" title="이전 선택으로 되돌리기"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>`:''}
function next(){
  S.qi++;skipInvalid();
  if(S.qi>=S.queue.length){
    if(S.stage>=STAGES.length-1){finish();return}
    const avail=shuffle(TRAITS.filter(t=>!S.traits.includes(t.id))).slice(0,3).map(t=>t.id);
    S.offer=avail;S.phase='stage';
  }else S.phase='event';
  save();render();
}
function pickTrait(id){
  S.traits.push(id);S.traitAt=S.traitAt||{};S.traitAt[id]=S.stage;S.joy=Math.max(0,Math.min(100,S.joy-8+familyBonus().total));S.stage++;buildQueue();S.phase='event';S.offer=null;save();render();
}
function familyBonus(){
  const paired=S.partner&&(S.partner.st==='married'||S.partner.st==='together');
  const p=paired?5:0, o=!paired&&S.solo?5:0, f=!paired&&S.cohouse?3:0;
  const a=S.pet&&S.pet.alive?3:0, k=S.kids?3:0;
  return {p,o,f,a,k,total:p+o+f+a+k};
}
function decideEnding(){
  const st=S.stats, v=ORDER.split('').map(k=>st[k]);
  const sorted=ORDER.split('').sort((a,b)=>st[b]-st[a]);
  const max=Math.max(...v),min=Math.min(...v);
  const paired=S.partner&&(S.partner.st==='married'||S.partner.st==='together');
  const sum=v.reduce((a,b)=>a+b,0);
  if(S.debt>=6)return 'bdebt';
  if(!paired&&!S.cohouse&&!S.kids&&!(S.pet&&S.pet.alive)&&S.iso>=5)return 'blone';
  if(S.idle>=6||S.idle>=4&&sum<175||sum<120)return 'bidle';
  if(max>=50&&S.joy<30&&(S.iso>=3||!paired))return 'bempty';
  const lastLog=S.log[S.log.length-1];
  if(S.bigFail>=3&&lastLog&&lastLog.v===false)return 'blost';
  if(S.joy<20)return 'rest';
  if(st.i>=40&&st.p>=40&&st.w>=26)return 'astro';
  if(S.partner&&S.partner.st!=='parted'&&S.partner.st!=='dating'&&S.kids&&S.pet&&S.pet.alive&&S.joy>=75)return 'fam';
  if(S.solo&&S.cohouse&&!(S.partner&&(S.partner.st==='married'||S.partner.st==='together'))&&S.joy>=70)return 'friends';
  if(S.biz==='ok'&&'cwd'.includes(sorted[0])&&st[sorted[0]]>=42&&S.joy>=35)return 'ceo';
  if((S.bond||0)>=4&&sorted.slice(0,2).includes('i'))return 'vet';
  if(min>=30)return 'ren';
  if(max-min<=15&&S.joy>=50)return 'ord';
  if(st[sorted[0]]-st[sorted[1]]>=18)return sorted[0];
  return [sorted[0],sorted[1]].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).join('');
}
function finish(){
  const id=decideEnding();S.ending=id;S.phase='ending';
  const got=ls.get(END_KEY)||{};if(!got[id])got[id]={name:S.name,gender:S.gender||'m',at:Date.now()};ls.set(END_KEY,got);
  ls.del(SAVE_KEY);render();
}
function save(){ls.set(SAVE_KEY,S)}

function scene(id){
  if(SCENES[id])return SCENES[id];
  return {bg:['#e8ece6','#a8b2a4'],U:{i:'#2f62cf',p:'#d24f33',d:'#8b7419',a:'#8a46c2',c:'#cc3f78',w:'#17806f'}[id]||'#3a6fd8'};
}
const SPRITE_CACHE={};
function sprite(id,gender){
  const key=id+(gender||'m');if(SPRITE_CACHE[key])return SPRITE_CACHE[key];
  if(typeof document==='undefined'||!document.createElement)return '';
  let cv;try{cv=document.createElement('canvas')}catch(e){return ''}
  if(!cv||!cv.getContext)return '';
  cv.width=cv.height=24;const x=cv.getContext('2d');if(!x)return '';
  const sc=scene(id),pal={...PX,U:sc.U||PX.U,V:sc.V||PX.V,F:sc.F||PX.F,H:sc.H||PX.H};
  const dot=(px,py,ch)=>{if(px<0||py<0||px>23||py>23)return;const c=pal[ch];if(!c)return;x.fillStyle=c;x.fillRect(px,py,1,1)};
  const put=(ox,oy,rows)=>rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.')dot(ox+i,oy+j,ch)}));
  x.fillStyle=sc.bg[0];x.fillRect(0,0,24,24);x.fillStyle=sc.bg[1];x.fillRect(0,21,24,3);
  const dk=sc.deco;
  if(dk==='stars')[[2,2],[6,5],[11,1],[14,6],[21,9],[4,10],[20,14],[9,3]].forEach(([a,b])=>dot(a,b,'Y'));
  if(dk==='snow')[[1,2],[5,6],[9,1],[13,4],[17,7],[21,3],[3,12],[20,11],[7,9],[15,10]].forEach(([a,b])=>dot(a,b,'W'));
  if(dk==='rain')for(let k=0;k<14;k++){const a=(k*7)%24,b=(k*5)%20;dot(a,b,'C');dot(a+1,b+1,'C')}
  if(dk==='lights')for(let a=1;a<24;a+=3)dot(a,2+(a%2),a%2?'Y':'R');
  if(dk==='city'){x.fillStyle='#1d2638';x.fillRect(0,8,6,13);x.fillRect(18,5,6,16);[[1,10],[3,12],[1,15],[4,17],[19,7],[21,9],[19,12],[22,14],[20,17]].forEach(([a,b])=>dot(a,b,'Y'))}
  if(dk==='spot'){x.fillStyle='rgba(255,240,180,.18)';for(let r=0;r<21;r++){const w=4+Math.floor(r/2);x.fillRect(12-w/2,r,w,1)}}
  if(dk==='piano'){for(let a=0;a<24;a+=2){dot(a,21,'K');dot(a,22,'K')}}
  if(dk==='curtain'){x.fillStyle='#a8323a';x.fillRect(0,0,4,21);x.fillRect(20,0,4,21);x.fillStyle='#d94a3a';x.fillRect(1,0,1,21);x.fillRect(22,0,1,21)}
  const py=sc.py!=null?sc.py:8,pxx=8;
  let body=(gender==='f'?BODY_F:BODY_M).slice();
  if(sc.bald)body=BODY_M.map(r=>r.replace(/H/g,'S'));
  put(pxx,py,body);
  (sc.over||[]).forEach(([a,b,r])=>put(pxx+a,py+b,r));
  (sc.props||[]).forEach(([a,b,r])=>put(a,b,r));
  return SPRITE_CACHE[key]=cv.toDataURL('image/png');
}
function spriteImg(id,gender,size,cls){const u=sprite(id,gender);return u?`<img class="${cls||'sprite'}" src="${u}" width="${size}" height="${size}" alt="">`:''}

/* ───────── 그리기 ───────── */
function ruler(){
  const W=470,x=a=>12+a*10, age=S?(S.phase==='ending'?45:ageNow()):0, cur=S?S.stage:-1;
  const narrow=window.innerWidth<520, fsS=narrow?18:13, fsN=narrow?16:11, every=narrow?10:5;
  let g='';
  STAGES.forEach((s,i)=>{
    const x1=x(s.from)-5,x2=x(s.to)+5;
    g+=`<rect x="${x1}" y="30" width="${x2-x1}" height="6" rx="2" fill="${i<=cur?'var(--pencil)':'var(--line)'}" opacity="${i===cur?1:i<cur?.45:1}"/>`;
    if(!narrow||i===cur){const cxm=Math.max(fsS*s.name.length/2+2,Math.min(W-fsS*s.name.length/2-2,(x1+x2)/2));
      g+=`<text x="${cxm}" y="${narrow?56:52}" text-anchor="middle" font-size="${fsS}" fill="${i===cur?'var(--ink)':'var(--muted)'}">${s.name}</text>`}
  });
  for(let a=0;a<=45;a++){const big=a%5===0;g+=`<line x1="${x(a)}" x2="${x(a)}" y1="${big?14:19}" y2="28" stroke="var(--muted)" stroke-width="${big?1.2:.7}"/>`;
    if(a%every===0)g+=`<text x="${x(a)}" y="11" text-anchor="middle" font-size="${fsN}" fill="var(--muted)">${a}</text>`}
  if(S){g+=`<line x1="${x(age)}" x2="${x(age)}" y1="12" y2="38" stroke="var(--mark)" stroke-width="4" stroke-linecap="round"/>
    <line x1="${x(age)-7}" x2="${x(age)+7}" y1="24" y2="22" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>`}
  return `<div class="ruler" aria-label="나이 ${age}세"><svg viewBox="0 0 ${W} ${narrow?66:58}" role="img"><title>키재기 자: 현재 ${age}세</title><g transform="translate(0,${narrow?4:0})">${g}</g></svg></div>`;
}
function statsPanel(d){
  const max=Math.max(50,...Object.values(S.stats));
  const face=S.joy>=75?'아주 행복':S.joy>=55?'즐거움':S.joy>=35?'그럭저럭':S.joy>=15?'지침':'바닥';
  return `<section class="stats" aria-label="능력치">${STATS.map(s=>`<div class="stat"><div class="top"><span style="color:var(--st-${s.k})">${s.n}</span><span class="v">${S.stats[s.k]}${d&&d[s.k]?`<small style="font-size:13px;color:var(--st-${s.k})"> ${d[s.k]>0?'+':''}${d[s.k]}</small>`:''}</span></div><div class="bar"><i style="width:${S.stats[s.k]/max*100}%;background:var(--st-${s.k})"></i></div></div>`).join('')}
  <div class="joy"><span>행복</span><div class="bar"><i style="width:${S.joy}%;background:var(--mark)"></i></div><span class="face">${face} ${S.joy}</span></div>
  ${S.traits.length||familyChips().length?`<div class="traits">${familyChips().map(f=>`<span class="trait-chip fam">${esc(f)}</span>`).join('')}${S.traits.map(id=>{const t=TRAITS.find(x=>x.id===id);return `<span class="trait-chip" title="${esc(t.d)}">${esc(tn(id))}</span>`}).join('')}</div>`:''}</section>`;
}
function fxTags(fx){return Object.keys(fx).filter(k=>ORDER.includes(k)&&fx[k]>0).map(k=>`<span class="tag ${k}">${SN[k]}</span>`).join('')}
function deltaTags(d){const lab={j:'행복',b:'반려동물과의 유대',l:'애정',iso:'고립',debt:'빚',idle:'게으름',gr:'성적'};return Object.keys(d).filter(k=>d[k]).map(k=>`<span class="tag ${ORDER.includes(k)?k:'j'}">${lab[k]||SN[k]} ${d[k]>0?'+':''}${d[k]}</span>`).join('')}
const UNIV={top:'청운대(명문대)',mid:'도담대',local:'해솔국립대',arts:'누리예대',sports:'한결체대',low:'미래산업대'};
function careerChip(){
  if(S.biz==='ok')return '회사 대표';
  if(S.path==='startup')return S.biz==='fail'?'폐업 경험':'창업 중';
  if(S.univ){const u=UNIV[S.univ];const c={corp:'대기업',grad:'대학원',civil:'공무원',small:'회사원'}[S.career];return c?`${u} · ${c}`:u}
  if(S.path==='job')return '현장 취업';
  if(S.path==='retake')return '재수 중';
  return null}
function familyChips(){const out=[],p=S.partner;const cc=careerChip();if(cc)out.push(cc);
  if(p&&p.st==='married')out.push(`배우자 ${p.name}`);
  else if(p&&p.st==='together')out.push(`동반자 ${p.name}`);
  else if(p&&p.st==='dating')out.push(`연인 ${p.name}`);
  else if(S.solo)out.push(S.cohouse?'비혼 · 친구들과 함께':'비혼');
  if(S.kids)out.push('아이 한 명');
  if(S.pet&&S.pet.name)out.push(S.pet.alive?`${S.pet.type==='dog'?'반려견':'반려묘'} ${S.pet.name}`:`추억 속의 ${S.pet.name}`);
  return out}
function masthead(){return `<header class="masthead"><div class="brand">45년<small>인생 성장 시뮬레이션</small></div><div class="row"><button class="linkbtn" data-a="settings" aria-expanded="${SETTINGS}">설정</button>${S&&S.phase!=='ending'?`<button class="linkbtn" data-a="home">처음 화면</button>`:''}<button class="linkbtn" data-a="coll">엔딩 도감</button></div></header>`+(SETTINGS?settingsPanel():'')}

function render(){
  let h=masthead();
  if(VIEW==='coll'){h+=collection();}
  else if(!S||VIEW==='title'){h+=titleScreen();}
  else if(S.phase==='intro'){const t=TEMPERS.find(t=>t.k===S.temper);
    h+=ruler()+`<section class="sheet fade"><div class="eyebrow"><span class="age">0세</span>탄생</div><h2>${esc(S.name)}, 세상에 오다</h2>
    <p class="story">새벽 4시 12분, 3.2kg. 간호사가 말했다. "건강한 ${S.gender==='f'?'여자아이':S.gender==='m'?'남자아이':'아기'}예요. ${t.n}네요." ${t.d}</p>
    <p class="story">지금부터 마흔다섯 해 동안 ${esc(S.name)}의 하루하루를 골라 주세요. 어떤 선택이 쌓이느냐에 따라 전혀 다른 어른이 됩니다.</p>
    <div class="deltas"><span class="tag ${S.temper}">타고난 ${SN[S.temper]} +4</span></div>
    <button class="btn" data-a="begin">첫 페이지 넘기기</button></section>`+statsPanel();}
  else if(S.phase==='event'){const ev=currentEvent();
    h+=ruler()+`<section class="sheet fade">${undoBtn()}<div class="eyebrow"><span class="age">${ageNow()}세</span>${STAGES[S.stage].name} · ${(S.done||0)+1} / ${stageTotal()}</div>
    <h2>${esc(fill(ev.t))}</h2><p class="story">${esc(fill(ev.x))}</p>
    <div class="choices">${choicesOf(ev).map((c,i)=>`<button class="choice" data-c="${i}"><span class="ct">${esc(fill(c.t))}</span><span class="meta">${c.chk?`<span class="tag check">${SN[c.chk]} 판정 · 성공 ${chance(c.chk,dcOf(c))}%</span>`:fxTags(c.fx)}</span></button>`).join('')}</div></section>`+statsPanel();}
  else if(S.phase==='petname'){const P=S.pending,kind=S.pet.type==='dog'?'강아지':'고양이';
    h+=ruler()+`<section class="sheet fade">${undoBtn()}<div class="eyebrow"><span class="age">${P.age}세</span>${esc(P.title)}</div>

/* ───────── 소리: 칩튠 BGM과 효과음 (Web Audio로 직접 합성) ───────── */
const AUDIO_KEY='jaraneun-audio-v1';
const AU={ctx:null,bgmVol:60,sfxVol:70,master:null,bgm:null,sfx:null,timer:null,mode:null,step:0,next:0};
(()=>{const p=ls.get(AUDIO_KEY);if(p){if(p.bv!=null)AU.bgmVol=p.bv;else if(p.bgm===false)AU.bgmVol=0;if(p.sv!=null)AU.sfxVol=p.sv;else if(p.sfx===false)AU.sfxVol=0}})();
function audioPrefs(){ls.set(AUDIO_KEY,{bv:AU.bgmVol,sv:AU.sfxVol})}
function ensureAudio(){
  if(!AU.ctx){
    try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}
    const c=AU.ctx;AU.master=c.createGain();AU.master.gain.value=.9;AU.master.connect(c.destination);
    AU.bgm=c.createGain();AU.bgm.gain.value=AU.bgmVol/100*.9;AU.bgm.connect(AU.master);
    AU.sfx=c.createGain();AU.sfx.gain.value=AU.sfxVol/100;AU.sfx.connect(AU.master);
  }
  if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});
  return true;
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(midi,t,dur,type,vol,dest,slide){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(mf(midi),t);
  if(slide!=null)o.frequency.exponentialRampToValueAtTime(mf(midi+slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
/* 곡 정의: 코드(근음, 장/단) 4마디 + 템포 + 조옮김 */
const MAJ=[0,4,7],MIN=[0,3,7];
const SONGS={
  title:{bpm:92,tr:0,prog:[[0,MAJ],[-3,MIN],[-7,MAJ],[-5,MAJ]]},
  s0:{bpm:96,tr:0,prog:[[0,MAJ],[-7,MAJ],[-3,MIN],[-5,MAJ]]},
  s1:{bpm:108,tr:2,prog:[[0,MAJ],[-3,MIN],[-7,MAJ],[-5,MAJ]]},
  s2:{bpm:112,tr:-3,prog:[[-3,MIN],[-7,MAJ],[0,MAJ],[-5,MAJ]]},
  s3:{bpm:104,tr:5,prog:[[0,MAJ],[-5,MAJ],[-3,MIN],[-7,MAJ]]},
  s4:{bpm:88,tr:-2,prog:[[-7,MAJ],[-5,MAJ],[0,MAJ],[-3,MIN]]},
  end:{bpm:78,tr:0,prog:[[-7,MAJ],[-5,MAJ],[-3,MIN],[0,MAJ]]},
  bad:{bpm:70,tr:0,prog:[[-3,MIN],[-7,MAJ],[0,MAJ],[4,MAJ]]}};
/* 마디별 멜로디 패턴: 코드 구성음 번호(0~5), null은 쉼표 */
const PAT=[[0,2,1,2,3,2,1,null],[3,null,4,3,2,null,1,null],[1,2,3,null,2,1,0,null],[2,null,1,null,0,null,null,null]];
function schedule(){
  if(!AU.ctx||!AU.mode)return;
  const song=SONGS[AU.mode],spb=60/song.bpm/2;
  while(AU.next<AU.ctx.currentTime+.25){
    const bar=Math.floor(AU.step/8)%4,pos=AU.step%8,[root,q]=song.prog[bar],base=60+song.tr+root;
    const tones=[0,1,2].flatMap(o=>q.map(x=>x+o*12));
    const n=PAT[(Math.floor(AU.step/8))%4][pos];
    if(n!=null)tone(base+12+tones[n],AU.next,spb*1.6,'square',.045,AU.bgm);
    if(pos===0||pos===4)tone(base-12,AU.next,spb*3.2,'triangle',.16,AU.bgm);
    if(pos===2||pos===6)tone(base-12+q[2],AU.next,spb*1.2,'triangle',.08,AU.bgm);
    AU.next+=spb;AU.step++;
  }
}
function setBgm(mode){
  if(!AU.ctx||AU.mode===mode)return;
  AU.mode=mode;AU.step=0;AU.next=AU.ctx.currentTime+.08;
  if(!AU.timer)AU.timer=setInterval(schedule,60);
}
function syncBgm(){
  if(!AU.ctx)return;
  let m='title';
  if(S&&VIEW!=='coll'&&VIEW!=='title'){
    if(S.phase==='ending'){const E=ENDINGS.find(e=>e.id===S.ending);m=E&&E.bad?'bad':'end'}
    else m='s'+Math.min(4,S.stage);
  }
  setBgm(m);
}
function sfx(kind){
  if(AU.sfxVol<=0||!ensureAudio())return;
  const t=AU.ctx.currentTime+.01,d=AU.sfx;
  if(kind==='pick'){tone(76,t,.07,'square',.12,d);tone(83,t+.06,.09,'square',.1,d)}
  else if(kind==='page'){tone(72,t,.05,'triangle',.18,d,5)}
  else if(kind==='ok'){[72,76,79,84].forEach((m,i)=>tone(m,t+i*.07,.16,'square',.1,d))}
  else if(kind==='ng'){tone(67,t,.12,'square',.1,d);tone(63,t+.12,.28,'square',.1,d,-5)}
  else if(kind==='trait'){[84,88,91,96,91].forEach((m,i)=>tone(m,t+i*.05,.12,'triangle',.14,d))}
  else if(kind==='pet'){tone(79,t,.08,'square',.1,d);tone(84,t+.1,.08,'square',.1,d);tone(88,t+.2,.2,'square',.1,d)}
  else if(kind==='end'){[60,64,67,72].forEach(m=>tone(m,t,1.6,'triangle',.12,d));tone(84,t+.2,1,'square',.06,d)}
  else if(kind==='bad'){[57,60,64].forEach(m=>tone(m,t,1.8,'triangle',.12,d));tone(45,t,1.8,'square',.05,d,-2)}
  else if(kind==='err'){tone(52,t,.15,'square',.1,d)}
}
function setVol(kind,v){
  v=Math.max(0,Math.min(100,Math.round(v)));

}

  else if(a==='petname'){namePet();sfx(S.phase==='result'?'pet':'err')}
  else if(a==='home'){VIEW='title';S=null;render()}
  else if(a==='again'){S=null;VIEW='title';render()}
  else if(a==='coll'){if(VIEW==='coll'){VIEW=S?'game':'title'}else VIEW='coll';render()}
  else if(a==='back'){VIEW=S?'game':'title';render()}
});
app.addEventListener('input',e=>{if(e.target.id==='nm'){TYPED=e.target.value;if(NAMEERR&&TYPED.trim()){NAMEERR=false;const m=document.getElementById('nmerr');if(m)m.remove();e.target.removeAttribute('aria-invalid')}}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){app.querySelector('[data-a="start"],[data-a="startok"]')?.click()}if(e.key==='Enter'&&e.target.id==='pn'&&!e.isComposing){namePet()}});
let lastNarrow=window.innerWidth<520;
window.addEventListener('resize',()=>{const n=window.innerWidth<520;if(n!==lastNarrow){lastNarrow=n;const r=app.querySelector('.ruler');if(r&&S){const t=document.createElement('div');t.innerHTML=ruler();r.replaceWith(t.firstElementChild)}}});
if(document.fonts&&document.fonts.load){document.fonts.load('16px NeoDunggeunmo').catch(()=>{})}
render();
</script>
